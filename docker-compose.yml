# Production-style stack: PostgreSQL + the app + Caddy (automatic HTTPS).
#
#   cp backend/.env.production.example backend/.env.production   # fill in secrets + your domain
#   DOMAIN=review.example.com docker compose up -d --build
#
# The app runs migrations on start (RUN_MIGRATIONS=true) using MIGRATION_DATABASE_URL (owner role),
# and serves requests with DATABASE_URL (least-privilege app role; see docs/DATABASE.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wrtm
      POSTGRES_USER: wrtm_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wrtm_owner -d wrtm']
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the app can reach the database.

  app:
    build: .
    restart: unless-stopped
    env_file: backend/.env.production
    environment:
      RUN_MIGRATIONS: 'true'
      TRUST_PROXY: '1'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data
    expose:
      - '4000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. review.example.com}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
